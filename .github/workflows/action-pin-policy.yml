name: Action pin policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/assert-pinned-actions.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/assert-pinned-actions.mjs'

permissions:
  contents: read

jobs:
  check:
    name: Check Action pins
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check external Action pins
        run: node scripts/assert-pinned-actions.mjs
