name: Verify Monorepo

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bundle_onnx_runtime:
        description: 'Build userscript with bundled onnxruntime-web JS runtime'
        type: boolean
        required: true
        default: false
      publish_userscript_artifact:
        description: 'Publish userscript artifact from this run'
        type: boolean
        required: true
        default: false
      run_userscript_e2e:
        description: 'Run userscript Playwright smoke test'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Require bundled runtime for published userscript artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_userscript_artifact && !inputs.bundle_onnx_runtime }}
        run: |
          echo "Publishing userscript artifacts requires bundle_onnx_runtime=true" >&2
          exit 1

      - name: Inputs accepted
        run: echo "Workflow inputs accepted."

  guardrails:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Render test Wrangler config
        env:
          MODEL_KEYS_KV_NAMESPACE_ID: test-kv
          MODEL_BUCKET_NAME: test-bucket
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Docs drift
        run: pnpm docs:check

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: Browser sink guardrail
        run: pnpm browser-sinks:check

  test:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render test Wrangler config
        env:
          MODEL_KEYS_KV_NAMESPACE_ID: test-kv
          MODEL_BUCKET_NAME: test-bucket
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Test
        run: pnpm test

  coverage-build:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render test Wrangler config
        env:
          MODEL_KEYS_KV_NAMESPACE_ID: test-kv
          MODEL_BUCKET_NAME: test-bucket
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Check default userscript bundle budget
        run: pnpm bundle:check:default

  userscript-e2e:
    needs: validate-inputs
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_userscript_e2e) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          output="$(pnpm --filter @hv-pony-solver/userscript exec playwright --version)"
          if [[ ! "$output" =~ ^Version\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            printf 'Unexpected Playwright version output: %q\n' "$output" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @hv-pony-solver/userscript exec playwright install --with-deps chromium

      - name: Userscript E2E smoke
        run: pnpm test:e2e:userscript

  bundled-userscript:
    needs:
      - validate-inputs
      - guardrails
      - test
      - coverage-build
      - userscript-e2e
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.bundle_onnx_runtime && needs['validate-inputs'].result == 'success' && needs.guardrails.result == 'success' && needs.test.result == 'success' && needs['coverage-build'].result == 'success' && ((inputs.run_userscript_e2e && needs['userscript-e2e'].result == 'success') || (!inputs.run_userscript_e2e && needs['userscript-e2e'].result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled userscript
        env:
          HV_PONY_SOLVER_ARTIFACT_MANIFEST_PATH: apps/userscript/dist/hv-pony-solver.artifact.json
          HV_PONY_SOLVER_ARTIFACT_SHA256_PATH: apps/userscript/dist/hv-pony-solver.user.js.sha256
          HV_PONY_SOLVER_METAFILE_PATH: apps/userscript/dist/hv-pony-solver.metafile.json
        run: pnpm --filter @hv-pony-solver/userscript build:bundled-runtime -- --minify

      - name: Check bundled userscript bundle budget
        run: pnpm bundle:check:bundled

      - name: Publish userscript artifact
        if: ${{ inputs.publish_userscript_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: hv-pony-solver-userscript
          path: |
            apps/userscript/dist/hv-pony-solver.user.js
            apps/userscript/dist/hv-pony-solver.user.js.sha256
            apps/userscript/dist/hv-pony-solver.artifact.json
            apps/userscript/dist/hv-pony-solver.metafile.json
          if-no-files-found: error
