name: Verify Monorepo

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_userscript_artifact:
        description: 'Publish userscript artifact from this run'
        type: boolean
        required: true
        default: false
      run_userscript_e2e:
        description: 'Run userscript Playwright smoke test'
        type: boolean
        required: true
        default: false
      publish_extension_artifact:
        description: 'Publish Chromium and Firefox extension artifacts from this run'
        type: boolean
        required: true
        default: false
      firefox_android_e2e_run_id:
        description: 'Successful external Firefox Android 142 evidence run ID (required for extension publication)'
        type: string
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Inputs accepted
        run: echo "Workflow inputs accepted."
      - name: Validate canonical packaged-model configuration
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUN_CANONICAL_PACKAGED_GATE == 'true' }}
        env:
          PACKAGED_MODEL_URL: ${{ secrets.PACKAGED_MODEL_URL || vars.PACKAGED_MODEL_URL }}
          PACKAGED_MODEL_BEARER_TOKEN: ${{ secrets.PACKAGED_MODEL_BEARER_TOKEN }}
          PACKAGED_MODEL_AUTH_REQUIRED: ${{ vars.PACKAGED_MODEL_AUTH_REQUIRED || 'false' }}
        run: |
          if [[ -z "${PACKAGED_MODEL_URL//[[:space:]]/}" ]]; then
            echo '::error title=Missing PACKAGED_MODEL_URL::Set the repository secret or variable PACKAGED_MODEL_URL before running the canonical packaged-model gate.'
            exit 1
          fi
          if [[ "$PACKAGED_MODEL_AUTH_REQUIRED" != 'true' && "$PACKAGED_MODEL_AUTH_REQUIRED" != 'false' ]]; then
            echo '::error title=Invalid PACKAGED_MODEL_AUTH_REQUIRED::Set PACKAGED_MODEL_AUTH_REQUIRED to true or false.'
            exit 1
          fi
          if [[ "$PACKAGED_MODEL_AUTH_REQUIRED" == 'true' && -z "${PACKAGED_MODEL_BEARER_TOKEN//[[:space:]]/}" ]]; then
            echo '::error title=Missing PACKAGED_MODEL_BEARER_TOKEN::Authentication is required but the repository secret is missing.'
            exit 1
          fi

  guardrails:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Render test Wrangler config
        env:
          MODEL_KEYS_KV_NAMESPACE_ID: test-kv
          MODEL_BUCKET_NAME: test-bucket
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Docs drift
        run: pnpm docs:check

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: Browser sink guardrail
        run: pnpm browser-sinks:check

  test:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render test Wrangler config
        env:
          MODEL_KEYS_KV_NAMESPACE_ID: test-kv
          MODEL_BUCKET_NAME: test-bucket
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Test
        run: pnpm test

  coverage-build:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render test Wrangler config
        env:
          MODEL_KEYS_KV_NAMESPACE_ID: test-kv
          MODEL_BUCKET_NAME: test-bucket
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hv-pony-solver-coverage
          path: '**/coverage/**'
          if-no-files-found: error

      - name: Build
        run: pnpm build

      - name: Check default userscript bundle budget
        run: pnpm bundle:check:default

      - name: Build userscript with bundled minimal runtime
        run: pnpm --filter @hv-pony-solver/userscript build:bundled-runtime -- --minify

      - name: Check bundled userscript bundle budget
        run: pnpm bundle:check:bundled

  userscript-e2e:
    needs: validate-inputs
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_userscript_e2e) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          output="$(pnpm --filter @hv-pony-solver/userscript exec playwright --version)"
          if [[ ! "$output" =~ ^Version\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            printf 'Unexpected Playwright version output: %q\n' "$output" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @hv-pony-solver/userscript exec playwright install --with-deps chromium

      - name: Userscript E2E smoke
        run: pnpm test:e2e:userscript

  extension-e2e:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          output="$(pnpm --filter @hv-pony-solver/extension exec playwright --version)"
          if [[ ! "$output" =~ ^Version\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            printf 'Unexpected Playwright version output: %q\n' "$output" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright extension browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-extension-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @hv-pony-solver/extension exec playwright install --with-deps chromium

      - name: Install Playwright Firefox
        run: pnpm --filter @hv-pony-solver/extension exec playwright install --with-deps firefox

      - name: Extension content E2E smoke
        run: pnpm test:e2e:extension:content

      - name: Chromium production remote extension load-only smoke
        run: pnpm test:e2e:extension:chromium:load-only

      - name: Firefox production remote extension load-only smoke
        run: pnpm test:e2e:extension:firefox:load-only

  extension-remote-authenticated-e2e:
    needs: validate-inputs
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_extension_artifact)) && vars.RUN_PRODUCTION_MODEL_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    environment: production-model-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @hv-pony-solver/extension exec playwright install --with-deps chromium

      - name: Validate protected remote-model smoke configuration
        env:
          KvKey: ${{ secrets.KV_KEY || secrets.KvKey }}
        run: |
          if [[ -z "${KvKey//[[:space:]]/}" ]]; then
            echo '::error title=Missing production-model-smoke.KV_KEY::Configure the KV_KEY secret in the production-model-smoke environment before running authenticated remote inference.'
            exit 1
          fi

      - name: Authenticated production remote-model detect
        env:
          KvKey: ${{ secrets.KV_KEY || secrets.KvKey }}
        run: pnpm test:e2e:extension:chromium:authenticated

  extension-minimum-versions-e2e:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install exact Chromium 116
        id: chromium-116
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: '116.0.5845.96'
          install-dependencies: true

      - name: Install Firefox 140 release
        id: firefox-140
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: '140.0'

      - name: Install pinned geckodriver
        id: geckodriver
        run: node apps/extension/scripts/install-geckodriver.mjs "$RUNNER_TEMP/geckodriver"

      - name: Build deterministic packaged fixture
        run: pnpm --filter @hv-pony-solver/extension build:packaged:fixture

      - name: Execute packaged fixture in Chromium 116
        env:
          CHROMIUM_PATH: ${{ steps.chromium-116.outputs.chrome-path }}
          PACKAGED_E2E_EVIDENCE_DIR: ${{ runner.temp }}/minimum-version-evidence
          PACKAGED_E2E_HEADLESS: 'false'
          REQUIRE_EXACT_MINIMUM_BROWSER: 'true'
        run: xvfb-run -a pnpm --filter @hv-pony-solver/extension test:e2e:packaged:chromium

      - name: Execute packaged fixture in Firefox 140
        env:
          FIREFOX_EXECUTABLE_PATH: ${{ steps.firefox-140.outputs.firefox-path }}
          GECKODRIVER_PATH: ${{ steps.geckodriver.outputs.path }}
          PACKAGED_E2E_EVIDENCE_DIR: ${{ runner.temp }}/minimum-version-evidence
          REQUIRE_EXACT_MINIMUM_BROWSER: 'true'
        run: pnpm --filter @hv-pony-solver/extension test:e2e:packaged:firefox

      - name: Upload exact-minimum execution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hv-pony-solver-extension-minimum-version-evidence
          path: ${{ runner.temp }}/minimum-version-evidence/*.json
          if-no-files-found: error

  extension-packaged-e2e:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          output="$(pnpm --filter @hv-pony-solver/extension exec playwright --version)"
          if [[ ! "$output" =~ ^Version\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            printf 'Unexpected Playwright version output: %q\n' "$output" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright extension browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-packaged-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium and Firefox
        run: pnpm --filter @hv-pony-solver/extension exec playwright install --with-deps chromium firefox

      - name: Install pinned geckodriver
        id: geckodriver
        run: node apps/extension/scripts/install-geckodriver.mjs "$RUNNER_TEMP/geckodriver"

      - name: Build deterministic packaged fixture
        run: pnpm --filter @hv-pony-solver/extension build:packaged:fixture

      - name: Chromium packaged fixture inference
        run: pnpm --filter @hv-pony-solver/extension test:e2e:packaged:chromium

      - name: Firefox packaged fixture inference
        env:
          GECKODRIVER_PATH: ${{ steps.geckodriver.outputs.path }}
        run: pnpm --filter @hv-pony-solver/extension test:e2e:packaged:firefox

  extension-canonical-packaged-e2e:
    needs: validate-inputs
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUN_CANONICAL_PACKAGED_GATE == 'true' }}
    runs-on: ubuntu-latest
    env:
      PACKAGED_MODEL_URL: ${{ secrets.PACKAGED_MODEL_URL || vars.PACKAGED_MODEL_URL }}
      PACKAGED_MODEL_BEARER_TOKEN: ${{ secrets.PACKAGED_MODEL_BEARER_TOKEN }}
      PACKAGED_MODEL_AUTH_REQUIRED: ${{ vars.PACKAGED_MODEL_AUTH_REQUIRED || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          output="$(pnpm --filter @hv-pony-solver/extension exec playwright --version)"
          if [[ ! "$output" =~ ^Version\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            printf 'Unexpected Playwright version output: %q\n' "$output" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright extension browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-canonical-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium and Firefox
        run: pnpm --filter @hv-pony-solver/extension exec playwright install --with-deps chromium firefox

      - name: Install pinned geckodriver
        id: geckodriver
        run: node apps/extension/scripts/install-geckodriver.mjs "$RUNNER_TEMP/geckodriver"

      - name: Download and verify canonical model
        run: node apps/extension/scripts/download-canonical-model.mjs

      - name: Build canonical packaged extensions
        run: pnpm --filter @hv-pony-solver/extension build:packaged

      - name: Chromium canonical packaged inference
        env:
          PACKAGED_E2E_EVIDENCE_DIR: ${{ runner.temp }}/canonical-e2e-evidence
        run: pnpm --filter @hv-pony-solver/extension test:e2e:packaged:chromium

      - name: Firefox canonical packaged inference
        env:
          GECKODRIVER_PATH: ${{ steps.geckodriver.outputs.path }}
          PACKAGED_E2E_EVIDENCE_DIR: ${{ runner.temp }}/canonical-e2e-evidence
        run: pnpm --filter @hv-pony-solver/extension test:e2e:packaged:firefox

      - name: Create canonical desktop E2E attestation
        run: |
          node apps/extension/scripts/release-gate.mjs attest \
            --evidence-dir "$RUNNER_TEMP/canonical-e2e-evidence" \
            --attestation apps/extension/dist/canonical-gate-attestation.json

      - name: Transfer canonical products to publication job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hv-pony-solver-extension-canonical-gate
          path: |
            apps/extension/dist/*.zip
            apps/extension/dist/*.zip.sha256
            apps/extension/dist/*.artifact.json
            apps/extension/dist/canonical-gate-attestation.json
          if-no-files-found: error
          retention-days: 1

  firefox-android-142-release-gate:
    needs: extension-canonical-packaged-e2e
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_extension_artifact && needs['extension-canonical-packaged-e2e'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download canonical desktop gate products
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hv-pony-solver-extension-canonical-gate
          path: apps/extension/dist

      - name: Download successful external Firefox Android 142 evidence
        env:
          ANDROID_EVIDENCE_RUN_ID: ${{ inputs.firefox_android_e2e_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$ANDROID_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'A numeric firefox_android_e2e_run_id is required for extension publication.' >&2
            exit 1
          fi
          if [[ "$ANDROID_EVIDENCE_RUN_ID" == "$GITHUB_RUN_ID" ]]; then
            echo 'Firefox Android evidence must come from a completed external run.' >&2
            exit 1
          fi
          conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_EVIDENCE_RUN_ID" --jq '.conclusion')"
          if [[ "$conclusion" != 'success' ]]; then
            echo "Firefox Android evidence run did not conclude successfully: $conclusion" >&2
            exit 1
          fi
          gh run download "$ANDROID_EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name hv-pony-solver-firefox-android-142-evidence \
            --dir "$RUNNER_TEMP/firefox-android-evidence"
          test -f "$RUNNER_TEMP/firefox-android-evidence/firefox-android-142-evidence.json"
          cp "$RUNNER_TEMP/firefox-android-evidence/firefox-android-142-evidence.json" \
            apps/extension/dist/firefox-android-142-evidence.json

      - name: Fail-closed desktop and Firefox Android release preflight
        env:
          PACKAGED_MODEL_URL: ${{ secrets.PACKAGED_MODEL_URL || vars.PACKAGED_MODEL_URL }}
          PACKAGED_MODEL_BEARER_TOKEN: ${{ secrets.PACKAGED_MODEL_BEARER_TOKEN }}
          PACKAGED_MODEL_AUTH_REQUIRED: ${{ vars.PACKAGED_MODEL_AUTH_REQUIRED || 'false' }}
        run: node apps/extension/scripts/release-gate.mjs preflight

      - name: Transfer complete extension release gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hv-pony-solver-extension-complete-release-gate
          path: |
            apps/extension/dist/*.zip
            apps/extension/dist/*.zip.sha256
            apps/extension/dist/*.artifact.json
            apps/extension/dist/canonical-gate-attestation.json
            apps/extension/dist/firefox-android-142-evidence.json
          if-no-files-found: error
          retention-days: 1

  userscript-artifact:
    needs:
      - validate-inputs
      - guardrails
      - test
      - coverage-build
      - userscript-e2e
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs['validate-inputs'].result == 'success' && needs.guardrails.result == 'success' && needs.test.result == 'success' && needs['coverage-build'].result == 'success' && ((inputs.run_userscript_e2e && needs['userscript-e2e'].result == 'success') || (!inputs.run_userscript_e2e && needs['userscript-e2e'].result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript with embedded custom runtime
        env:
          HV_PONY_SOLVER_ARTIFACT_MANIFEST_PATH: apps/userscript/dist/hv-pony-solver.artifact.json
          HV_PONY_SOLVER_ARTIFACT_SHA256_PATH: apps/userscript/dist/hv-pony-solver.user.js.sha256
          HV_PONY_SOLVER_METAFILE_PATH: apps/userscript/dist/hv-pony-solver.metafile.json
        run: pnpm --filter @hv-pony-solver/userscript build:bundled-runtime -- --minify

      - name: Check userscript bundle budget
        run: pnpm bundle:check:bundled

      - name: Publish userscript artifact
        if: ${{ inputs.publish_userscript_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hv-pony-solver-userscript
          path: |
            apps/userscript/dist/hv-pony-solver.user.js
            apps/userscript/dist/hv-pony-solver.user.js.sha256
            apps/userscript/dist/hv-pony-solver.artifact.json
            apps/userscript/dist/hv-pony-solver.metafile.json
          if-no-files-found: error

  extension-artifact:
    needs:
      - validate-inputs
      - guardrails
      - test
      - coverage-build
      - extension-e2e
      - extension-packaged-e2e
      - extension-canonical-packaged-e2e
      - extension-minimum-versions-e2e
      - extension-remote-authenticated-e2e
      - firefox-android-142-release-gate
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_extension_artifact && needs['validate-inputs'].result == 'success' && needs.guardrails.result == 'success' && needs.test.result == 'success' && needs['coverage-build'].result == 'success' && needs['extension-e2e'].result == 'success' && needs['extension-packaged-e2e'].result == 'success' && needs['extension-canonical-packaged-e2e'].result == 'success' && needs['extension-minimum-versions-e2e'].result == 'success' && needs['extension-remote-authenticated-e2e'].result == 'success' && needs['firefox-android-142-release-gate'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download complete extension release gate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hv-pony-solver-extension-complete-release-gate
          path: apps/extension/dist

      - name: Fail-closed release preflight
        env:
          PACKAGED_MODEL_URL: ${{ secrets.PACKAGED_MODEL_URL || vars.PACKAGED_MODEL_URL }}
          PACKAGED_MODEL_BEARER_TOKEN: ${{ secrets.PACKAGED_MODEL_BEARER_TOKEN }}
          PACKAGED_MODEL_AUTH_REQUIRED: ${{ vars.PACKAGED_MODEL_AUTH_REQUIRED || 'false' }}
        run: node apps/extension/scripts/release-gate.mjs preflight

      - name: Publish extension artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hv-pony-solver-extension
          path: |
            apps/extension/dist/*.zip
            apps/extension/dist/*.zip.sha256
            apps/extension/dist/*.artifact.json
          if-no-files-found: error
