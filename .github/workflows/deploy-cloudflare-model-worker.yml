name: Deploy Cloudflare Model Worker

on:
  workflow_dispatch:
    inputs:
      publish_model_worker:
        description: 'Deploy Model Worker after validation'
        type: boolean
        required: true
        default: false
      invalid_key_mode:
        description: 'Invalid token behavior'
        type: choice
        required: true
        default: decoy
        options:
          - decoy
          - error

permissions:
  contents: read

concurrency:
  group: deploy-model-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:high

      - name: Check Cloudflare deployment secrets
        id: cloudflare_secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$MODEL_KEYS_KV_NAMESPACE_ID" ] && [ -n "$MODEL_BUCKET_NAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment secrets are incomplete; skipping Wrangler dry-run and deploy."
          fi

      - name: Require Cloudflare secrets for deployment
        if: ${{ inputs.publish_model_worker && steps.cloudflare_secrets.outputs.ready != 'true' }}
        run: |
          echo "Publishing Model Worker requires complete Cloudflare deployment secrets." >&2
          exit 1

      - name: Render Wrangler config
        if: ${{ steps.cloudflare_secrets.outputs.ready == 'true' }}
        env:
          HV_PONY_SOLVER_RENDER_ENV: deploy
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
          INVALID_KEY_MODE: ${{ inputs.invalid_key_mode }}
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Typecheck
        run: pnpm --filter @hv-pony-solver/model-worker typecheck

      - name: Test
        run: pnpm --filter @hv-pony-solver/model-worker test

      - name: Wrangler dry-run
        if: ${{ steps.cloudflare_secrets.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
          INVALID_KEY_MODE: ${{ inputs.invalid_key_mode }}
        run: |
          pnpm --filter @hv-pony-solver/model-worker exec node scripts/validate-wrangler-config.mjs
          pnpm --filter @hv-pony-solver/model-worker exec wrangler deploy --dry-run

      - name: Deploy Worker
        if: ${{ inputs.publish_model_worker && steps.cloudflare_secrets.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
          INVALID_KEY_MODE: ${{ inputs.invalid_key_mode }}
        run: pnpm --filter @hv-pony-solver/model-worker run deploy
