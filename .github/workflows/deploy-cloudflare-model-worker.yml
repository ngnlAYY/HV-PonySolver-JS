name: Deploy Cloudflare Model Worker

on:
  workflow_dispatch:
    inputs:
      publish_model_worker:
        description: 'Deploy Model Worker after validation'
        type: boolean
        required: true
        default: false
      invalid_key_mode:
        description: 'Invalid token behavior'
        type: choice
        required: true
        default: decoy
        options:
          - decoy
          - error
      enable_model_download_quota:
        description: 'Enable per-Key monthly model download limits'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-model-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    environment: production-model-worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:high

      - name: Check Cloudflare deployment secrets
        id: cloudflare_secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
        run: |
          if [ -n "${CLOUDFLARE_ACCOUNT_ID//[[:space:]]/}" ] && [ -n "${CLOUDFLARE_API_TOKEN//[[:space:]]/}" ] && [ -n "${MODEL_KEYS_KV_NAMESPACE_ID//[[:space:]]/}" ] && [ -n "${MODEL_BUCKET_NAME//[[:space:]]/}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment secrets are incomplete; skipping Wrangler dry-run and deploy."
          fi

      - name: Require Cloudflare secrets for deployment
        if: ${{ inputs.publish_model_worker && steps.cloudflare_secrets.outputs.ready != 'true' }}
        run: |
          echo "Publishing Model Worker requires complete Cloudflare deployment secrets." >&2
          exit 1

      - name: Require main branch for deployment
        if: ${{ inputs.publish_model_worker && github.ref != 'refs/heads/main' }}
        run: |
          echo "Publishing Model Worker is restricted to refs/heads/main." >&2
          exit 1

      - name: Render Wrangler config
        if: ${{ steps.cloudflare_secrets.outputs.ready == 'true' }}
        env:
          HV_PONY_SOLVER_RENDER_ENV: deploy
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
          INVALID_KEY_MODE: ${{ inputs.invalid_key_mode }}
          MODEL_DOWNLOAD_QUOTA_ENABLED: ${{ inputs.enable_model_download_quota }}
        run: pnpm --filter @hv-pony-solver/model-worker render-config

      - name: Typecheck
        run: pnpm --filter @hv-pony-solver/model-worker typecheck

      - name: Test
        run: pnpm --filter @hv-pony-solver/model-worker test

      - name: Wrangler dry-run
        if: ${{ steps.cloudflare_secrets.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
          INVALID_KEY_MODE: ${{ inputs.invalid_key_mode }}
          MODEL_DOWNLOAD_QUOTA_ENABLED: ${{ inputs.enable_model_download_quota }}
        run: |
          pnpm --filter @hv-pony-solver/model-worker exec node scripts/validate-wrangler-config.mjs
          pnpm --filter @hv-pony-solver/model-worker exec wrangler deploy --dry-run

      - name: Deploy Worker
        if: ${{ inputs.publish_model_worker && github.ref == 'refs/heads/main' && steps.cloudflare_secrets.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODEL_KEYS_KV_NAMESPACE_ID: ${{ secrets.MODEL_KEYS_KV_NAMESPACE_ID }}
          MODEL_BUCKET_NAME: ${{ secrets.MODEL_BUCKET_NAME }}
          INVALID_KEY_MODE: ${{ inputs.invalid_key_mode }}
          MODEL_DOWNLOAD_QUOTA_ENABLED: ${{ inputs.enable_model_download_quota }}
        run: pnpm --filter @hv-pony-solver/model-worker run deploy
