<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HV Pony Solver 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>HV Pony Solver</h1>
      <p class="intro">扩展版设置。模型 Key 仅保存在本扩展的 IndexedDB 中，不会写入构建产物或同步存储。</p>
      <form id="settings-form">
        <label>
          答题模式
          <select id="answer-mode">
            <option value="auto">自动选择并提交</option>
            <option value="manual">只显示识别结果</option>
          </select>
        </label>
        <label>
          提交延迟（毫秒或范围）
          <input id="submit-delay" inputmode="numeric" autocomplete="off" />
        </label>
        <label>
          多选点击间隔（毫秒或范围）
          <input id="multi-click-delay" inputmode="numeric" autocomplete="off" />
        </label>
        <label>
          面板位置（top,left）
          <input id="panel-position" autocomplete="off" />
        </label>
        <label>
          历史记录显示条数
          <input id="history-limit" type="number" min="1" max="50" />
        </label>
        <label class="checkbox">
          <input id="panel-compact" type="checkbox" />
          使用紧凑面板
        </label>
        <label class="checkbox">
          <input id="panel-require-csp" type="checkbox" checked />
          仅在验证码窗口（div#csp）存在时显示面板
        </label>
        <label class="checkbox">
          <input id="random-on-fail" type="checkbox" />
          识别失败时随机选择一个答案
        </label>
        <label class="checkbox">
          <input id="preserve-checked-answers" type="checkbox" checked />
          自动答题前保留已勾选答案，允许手动参与选择
        </label>
        <div class="actions">
          <button type="submit" disabled>保存设置</button>
        </div>
        <fieldset id="model-key-fieldset" class="key-settings" aria-describedby="packaged-model-hint" disabled>
          <legend>模型 Key</legend>
          <label>
            模型 Key
            <input id="model-key" type="password" autocomplete="off" placeholder="留空则保持现有 Key" />
          </label>
          <div class="actions">
            <button id="verify-key" type="button">验证并保存 Key</button>
            <button id="query-model-quota" type="button">查询下载次数</button>
            <button id="download-model" type="button">下载模型</button>
            <button id="clear-key" type="button" class="secondary">清除 Key</button>
            <button id="cancel-key-op" type="button" class="secondary" disabled>取消进行中的 Key 操作</button>
          </div>
        </fieldset>
        <p id="packaged-model-hint" class="model-hint" hidden>当前版本已内置模型，无需配置模型 Key。</p>
      </form>
      <output id="status" aria-live="polite"></output>
    </main>
    <script src="options.js"></script>
  </body>
</html>
