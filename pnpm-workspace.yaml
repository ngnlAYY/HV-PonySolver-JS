packages:
  - apps/*
  - packages/*

overrides:
  brace-expansion@1: "^1.1.18"
  brace-expansion@5: "^5.0.9"
  nanoid@3: "^3.3.18"
  undici@7: "^7.29.0"
  esbuild: "0.28.2"
  js-yaml: "4.3.1"
  postcss: "^8.5.26"
  protobufjs: "8.7.2"
  sharp: "^0.35.3"
  vite: "8.2.1"
  ws: "8.21.3"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260810.1'

# image-size has no fixed release for these advisories. audit:high verifies the
# exact local patch and its regression probes before applying scoped ignores.
patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch

# These ignores are safe only while the exact patch above and audit:high's
# executable regression gate remain present.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
